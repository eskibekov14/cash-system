services:
  postgres-db:
    image: postgres:12-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: donttouchmydatabase
      POSTGRES_MULTIPLE_DATABASES: "menu,order,auth"
    volumes:
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - backend

  menu-service:
    build: ../menu-service
    image: cash-system/menu-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/menu
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=donttouchmydatabase
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_LIQUIBASE_CHANGE_LOG=classpath:db.migrations/changelog-master.xml
      - SERVER_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    networks:
      - backend

  auth-service:
    build: ../auth-service
    image: cash-system/auth-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/auth
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=donttouchmydatabase
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_LIQUIBASE_CHANGE_LOG=classpath:db.migrations/changelog-master.xml
      - SERVER_PORT=8082
    ports:
      - "18082:8082"
    depends_on:
      - postgres-db
    networks:
      - backend

  order-service:
    build: ../order-service
    image: cash-system/order-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/order
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=donttouchmydatabase
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_PORT=8081
      - MENU_SERVICE_BASE_URL=http://menu-service:8080/api
      - AUTH_SERVICE_BASE_URL=http://auth-service:8082/api/auth
    ports:
      - "8081:8081"
    depends_on:
      - postgres-db
      - menu-service
      - auth-service
    networks:
      - backend

networks:
  backend:
    driver: bridge
